networks:
  songbook_net:
    driver: bridge
  external_net:
    driver: bridge
    external: true

services:
  songbook:
    # Development build: `next dev` with hot reload. Source is bind-mounted, so
    # code/content edits apply without rebuilding. Rebuild only when
    # package.json / package-lock.json change (`docker compose up --build`).
    build:
      context: .
      target: dev
    image: songbook-web-app:dev
    container_name: songbook
    ports:
      - "${SONGBOOK_ADMIN_PORT:-3000}:3000"
    volumes:
      - .:/app
      # Keep container-built dependencies and Next.js cache out of the host tree.
      - /app/node_modules
      - /app/.next
      - ${SONGBOOK_DATA_DIR:-./data}:/app/data
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=${SONGBOOK_WATCH_POLLING:-false}
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - DATA_DIR=/app/data
      - SONGBOOK_DEV_ALLOWED_ORIGINS=${SONGBOOK_DEV_ALLOWED_ORIGINS:-}
      # --- Revision garbage collection (0 keeps everything) ---
      - REVISIONS_MAX_COUNT=${SONGBOOK_REVISIONS_MAX_COUNT:-50}
      - REVISIONS_MAX_AGE_DAYS=${SONGBOOK_REVISIONS_MAX_AGE_DAYS:-90}
      - ADMIN_PASSWORD=${SONGBOOK_ADMIN_PASSWORD:-admin}
      # --- Languages (optional — set LANGUAGES to configure without content files) ---
      - LANGUAGES=${SONGBOOK_LANGUAGES:-en,es,fr}
      - LANGUAGES_DEFAULT=${SONGBOOK_LANGUAGES_DEFAULT:-es}
      # --- Navidrome share links (all optional — omit to disable) ---
      - SONGBOOK_NAVIDROME_SONGS_URL=${SONGBOOK_NAVIDROME_SONGS_URL:-}
      - SONGBOOK_NAVIDROME_USERNAME=${SONGBOOK_NAVIDROME_USERNAME:-}
      - SONGBOOK_NAVIDROME_PASSWORD=${SONGBOOK_NAVIDROME_PASSWORD:-}
      # --- Spotify Web API (optional — enables automatic Spotify embed players) ---
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      # --- VOICES Navidrome (optional — per-voice-part recordings) ---
      - SONGBOOK_VOICES_NAVIDROME_SONGS_URL=${SONGBOOK_VOICES_NAVIDROME_SONGS_URL:-}
      - SONGBOOK_VOICES_NAVIDROME_USERNAME=${SONGBOOK_VOICES_NAVIDROME_USERNAME:-}
      - SONGBOOK_VOICES_NAVIDROME_PASSWORD=${SONGBOOK_VOICES_NAVIDROME_PASSWORD:-}
      - SONGBOOK_NAVIDROME_FRAME_ORIGINS="${SONGBOOK_VOICES_NAVIDROME_SONGS_URL:-} ${SONGBOOK_NAVIDROME_SONGS_URL:-}"
      # Voice-matching vocabulary defaults to content/config/voices.json inside
      # the mounted content tree; uncomment to point at a custom JSON file.
      # - SONGBOOK_VOICES_MATCHING_FILE=/app/config/voices.json
      # --- Public/read-only instance base URL (used in setlist share links) ---
      - SONGBOOK_PUBLIC_URL=${SONGBOOK_PUBLIC_URL:-}
      # --- Setlist limits ---
      - SETLIST_MAX_SONGS=${SETLIST_MAX_SONGS:-50}
      - SETLIST_LINK_EMBED_HOSTS=${SETLIST_LINK_EMBED_HOSTS:-}
      - SETLIST_LINK_ALLOW_HTTP=${SETLIST_LINK_ALLOW_HTTP:-false}
      # --- Branding & Contact (optional) ---
      - SONGBOOK_APP_NAME=${SONGBOOK_APP_NAME:-Songbook}
      - SONGBOOK_CONTACT_EMAIL=${SONGBOOK_CONTACT_EMAIL:-}
      # --- OIDC / SSO (all optional — set OIDC_ISSUER to enable) ---
      # - OIDC_ISSUER=https://auth.example.com/realms/main
      # - OIDC_CLIENT_ID=songbook
      # - OIDC_CLIENT_SECRET=your-client-secret
      # - OIDC_SCOPES=openid profile email
      # - OIDC_ROLE_CLAIM=groups
      # - OIDC_ROLE_ADMIN=songbook-admin
      # - OIDC_ROLE_REVIEWER=songbook-editor
      # - OIDC_DEFAULT_ROLE=public
      # - OIDC_BUTTON_LABEL=Sign in with SSO
      # - OIDC_AUTO_REDIRECT=false
      # - OIDC_LOGOUT_URL=https://auth.example.com/realms/main/protocol/openid-connect/logout
    restart: unless-stopped
    networks:
      - songbook_net
      - external_net

  # Read-only public instance (no login, no admin, no writes).
  # Serves the same content/music, mounted read-only, with SONGBOOK_READONLY=1.
  # Point your public hostname at SONGBOOK_PUBLIC_PORT and keep `songbook` private.
  songbook-public:
    build:
      context: .
      target: runner
    image: songbook-web-app:latest
    container_name: songbook-public
    ports:
      - "${SONGBOOK_PUBLIC_PORT:-9000}:3000"
    volumes:
      - ${SONGBOOK_DATA_DIR:-./data}:/app/data
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - DATA_DIR=/app/data
      - LANGUAGES=${SONGBOOK_LANGUAGES:-en,es,fr}
      - LANGUAGES_DEFAULT=${SONGBOOK_LANGUAGES_DEFAULT:-es}
      - SONGBOOK_READONLY=1
      # --- Navidrome share links (all optional — omit to disable) ---
      - SONGBOOK_NAVIDROME_SONGS_URL=${SONGBOOK_NAVIDROME_SONGS_URL:-}
      - SONGBOOK_NAVIDROME_USERNAME=${SONGBOOK_NAVIDROME_USERNAME:-}
      - SONGBOOK_NAVIDROME_PASSWORD=${SONGBOOK_NAVIDROME_PASSWORD:-}
      # --- Spotify Web API (optional — enables automatic Spotify embed players) ---
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      # --- VOICES Navidrome (optional — per-voice-part recordings) ---
      - SONGBOOK_VOICES_NAVIDROME_SONGS_URL=${SONGBOOK_VOICES_NAVIDROME_SONGS_URL:-}
      - SONGBOOK_VOICES_NAVIDROME_USERNAME=${SONGBOOK_VOICES_NAVIDROME_USERNAME:-}
      - SONGBOOK_VOICES_NAVIDROME_PASSWORD=${SONGBOOK_VOICES_NAVIDROME_PASSWORD:-}
      - SONGBOOK_NAVIDROME_FRAME_ORIGINS=${SONGBOOK_NAVIDROME_FRAME_ORIGINS:-}
      # --- Public/read-only instance base URL (used in setlist share links) ---
      - SONGBOOK_PUBLIC_URL=${SONGBOOK_PUBLIC_URL:-}
      # --- Setlist limits ---
      - SETLIST_MAX_SONGS=${SETLIST_MAX_SONGS:-50}
      - SETLIST_LINK_EMBED_HOSTS=${SETLIST_LINK_EMBED_HOSTS:-}
      - SETLIST_LINK_ALLOW_HTTP=${SETLIST_LINK_ALLOW_HTTP:-false}
      # --- Branding & Contact (optional) ---
      - SONGBOOK_APP_NAME=${SONGBOOK_APP_NAME:-Songbook}
      - SONGBOOK_CONTACT_EMAIL=${SONGBOOK_CONTACT_EMAIL:-}
    restart: unless-stopped
    networks:
      - songbook_net
      - external_net